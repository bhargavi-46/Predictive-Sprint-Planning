name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: "Server: test on Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current LTS plus the next major, so an upgrade never lands as a surprise.
        node: [20, 22]

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-not-used-outside-tests

      - name: Benchmark the forecast engine
        run: npm run bench

  client:
    name: "Client: lint and build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Production build
        run: npm run build

  docker:
    name: "Docker: build images"
    runs-on: ubuntu-latest
    needs: [server, client]

    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -t sprint-api:ci ./server

      - name: Build the client image
        run: docker build -t sprint-web:ci ./client

  audit:
    name: "Security: dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Two passes, because the two questions are different.
      #
      # Runtime dependencies ship to users, so any moderate-or-worse advisory
      # there fails the build. Build tooling never reaches production — a dev
      # server advisory is worth knowing about but must not block a release,
      # so the full audit is reported without failing.
      - name: Audit runtime dependencies (blocking)
        run: |
          npm audit --omit=dev --audit-level=moderate --prefix server
          npm audit --omit=dev --audit-level=moderate --prefix client

      - name: Audit build tooling (advisory only)
        continue-on-error: true
        run: |
          npm audit --audit-level=high --prefix server
          npm audit --audit-level=high --prefix client
